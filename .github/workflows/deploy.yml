name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    # secrets can't be read in `if:` directly, so surface presence via env.
    # no token yet → skip green (we deploy locally with wrangler until it's added).
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip (no CLOUDFLARE_API_TOKEN secret)
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping deploy. Deploy locally with wrangler, or add the secret."

      - uses: actions/checkout@v4
        if: env.HAS_CF_TOKEN == 'true'

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: deffa184038440afc07f53b5e7583a97
          wranglerVersion: '4.92.0'   # match local; accepts our compatibility_date
          # reads wrangler.toml: project "vestibule-quarterly", output dir public/
          command: pages deploy
